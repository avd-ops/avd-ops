# The knowledge base family: sibling KBs that share this KB's format and know about each other.
# Schema: schema/family.schema.json, the same in every KB. How it works:
# curation.md#staying-aligned-with-the-family. Add a sibling's repo once it's known, then add
# its two sources in sources.toml.
#
# avd-ops is the front door for the AVD repos (decision 0002). Each repo stays the source of truth for
# itself; these pages explain how they fit together and link to them. Related projects outside the
# AVD family are listed in repos.json at the repo root, not here.

format_version: 1
projects:
- id: avd-ops
  name: avd-ops
  self: true
  repo: avd-ops/avd-ops
  kb_path: docs/knowledge
  role: member
  focus: The front door for the AVD repos (avd-ops.dev), onboarding and user docs
  owns: [onboarding and user-facing docs for the AVD repos, the avd-ops.dev site and design system, the list of family repos (repos.json)]
  format_version: 1
- id: 2ndbrain
  name: 2ndbrain
  repo: nickprignano/2ndbrain
  kb_path: docs/knowledge
  role: reference
  focus: The template that owns the family knowledge base format
  owns: [the family knowledge base format, its scripts and schemas]
  format_version: 1
- id: avd
  name: AVD
  repo: avd-ops/avd-second-brain
  kb_path: docs/knowledge
  role: member
  focus: Azure Virtual Desktop itself, across its lifecycle (assess, inventory, deploy, operate), and the intelligence layer behind avd-swarm
  owns: [Azure Virtual Desktop platform, FSLogix, session host images in general, the AVD landing zone and its operations, the contracts between the AVD repos]
  format_version: 1
- id: liquidware
  name: Liquidware
  repo: nickprignano/avd-liquidware
  kb_path: docs/knowledge
  role: member
  focus: Liquidware products on virtual desktops, starting with Stratusphere UX in Azure
  owns: [Liquidware products, Stratusphere UX appliances, the Liquidware tier for the landing zone]
  format_version: 1
