# Known errors catalog: the source of truth for troubleshooting/README.md.
# Regenerate the page with `python3 scripts/kb/build.py`. Schema: ../schema/known-errors.schema.json
# `source` is a KB path (relative to docs/knowledge/) or an https URL.

errors:
  - id: bash-3-bad-substitution
    symptom: "deploy.sh: line N: ${JUMPBOX_OS,,}: bad substitution (or mapfile: command not found)"
    cause: macOS ships Bash 3.2; avd-landing-zone's deploy.sh uses Bash 4 features (lowercase expansion, mapfile).
    fix: Run it from Azure Cloud Shell, or install a newer bash (Homebrew) and run it with that bash instead of /bin/bash.
    source: decisions/0006-run-anywhere.md
    applies_to: avd-landing-zone e66d866
    status: unverified
    added: "2026-10-21"
  - id: sh-crlf-on-windows
    symptom: "$'\\r': command not found"
    cause: A Windows checkout with core.autocrlf turned a .sh file's line endings into CRLF.
    fix: Add `*.sh text eol=lf` to .gitattributes, or re-clone with `git config core.autocrlf input`.
    source: decisions/0006-run-anywhere.md
    status: unverified
    added: "2026-10-21"
  - id: git-bash-resource-id-rewritten
    symptom: "az ... --ids fails with a resource ID that starts with C:/Program Files/Git/subscriptions/..."
    cause: Git Bash (MSYS) converts arguments that start with / into Windows paths.
    fix: Set MSYS_NO_PATHCONV=1 before running the script, or run it from Cloud Shell.
    source: decisions/0006-run-anywhere.md
    status: unverified
    added: "2026-10-21"

  - id: pinned-json-hash-crlf-on-windows
    symptom: "assess/method.json does not match its hash in assess/PINS.json. Re-copy it from avd-assess at the pinned commit."
    cause: A Windows checkout with Git's default core.autocrlf (or `* text=auto`) wrote a vendored JSON file with CRLF, so its SHA-256 no longer matched the pin. Seen on a Windows CI runner.
    fix: Mark every hashed vendored file `-text` in .gitattributes (avd-current-state `assess/*.json`, `contracts/*.json`; avd-landing-zone `contracts/...`), then re-clone or `git rm --cached -r . && git reset --hard`.
    source: https://github.com/avd-ops/avd-current-state/pull/36
    applies_to: avd-current-state 6359ece
    status: verified
    added: "2026-10-21"
  - id: bsd-date-no-d
    symptom: "Not a time: '2030-01-01T00:00Z' (deploy.sh --jumpbox-keep-running on macOS)"
    cause: macOS ships BSD date, which has no -d; GNU `date -d` works on Linux, Cloud Shell and Git Bash only. Homebrew bash does not change this. Seen on a macOS CI runner.
    fix: Fall back to `date -j -u -f '%Y-%m-%dT%H:%MZ' "$value" +%s` when `date -d` fails (avd-landing-zone #105).
    source: https://github.com/avd-ops/avd-landing-zone/pull/105
    applies_to: avd-landing-zone 68ffda5
    status: verified
    added: "2026-10-21"
  - id: pwsh-child-loads-real-az-over-fakes
    symptom: "A test that runs a script in a child pwsh with PSModulePath set to fake modules signs in for real (InteractiveBrowserCredential ... must be executed on the main thread on macOS)"
    cause: pwsh puts the user and shared module folders back in front of PSModulePath at startup, so an Az install there (macOS runners keep one) wins over the fakes.
    fix: Set $env:PSModulePath inside the child (`pwsh -Command "`$env:PSModulePath = '<fakes>'; & '<script>' ..."`) instead of only in the parent.
    source: https://github.com/avd-ops/avd-current-state/pull/36
    applies_to: PowerShell 7.4
    status: verified
    added: "2026-10-21"
  - id: github-mergeable-state-unknown
    symptom: "GET /repos/{owner}/{repo}/pulls/{n} returns mergeable: null and mergeable_state: unknown for a pull request that is ready"
    cause: GitHub works out mergeability in the background after a push or a base-branch change; the first read only starts that job. Unauthenticated callers also share 60 requests an hour per network, so polling in a loop runs out quickly (HTTP 403, x-ratelimit-remaining 0).
    fix: Treat unknown as still checking, never as ready, and read again a minute later. Cache results, skip pull requests already merged or closed, and read x-ratelimit-remaining and x-ratelimit-reset (exposed to browsers) before the next batch, as site/assets/checklist-core.js does. The rules in force on a branch (`/rules/branches/{branch}`) and private vulnerability reporting (`/private-vulnerability-reporting`) are readable without signing in on a public repo.
    source: https://docs.github.com/en/rest/pulls/pulls#get-a-pull-request
    applies_to: GitHub REST API 2022-11-28
    status: verified
    added: "2026-10-21"
  - id: shell-menu-button-on-wide-screens
    symptom: "The menu (pages) button shows in the avd-ops brand bar on a wide screen, where the side list is already visible."
    cause: "`.shell .menu{display:none}` lost to `.shell header.bar .iconbtn{display:grid}`, which is more specific (two classes and two elements against two classes). Design system 2.2.0 and earlier."
    fix: "Scope the hide and the show to the same selector depth as the button style: `.shell header.bar .menu` (design system 2.3.0). A copy pinned at 2.2.0 or earlier can add that rule to its own stylesheet."
    source: decisions/0005-one-app-shell-for-every-page.md
    applies_to: avd-ops 5eff96d
    status: verified
    added: "2026-10-21"
  - id: classic-script-in-esm-repo
    symptom: "TypeError: Cannot read properties of undefined (reading 'AvdOpsEngine') when a test requires a portal engine file"
    cause: "The repo's package.json says `type: module`, so Node loads every .js file under it as an ES module: `module` is undefined and `this` is undefined at the top level, and the UMD wrapper falls through to the browser branch."
    fix: "Put a package.json with `\"type\": \"commonjs\"` beside the classic scripts (avd-ops `site/assets/engine/package.json`); a portal that vendors the engine into an ESM repo copies it too."
    source: https://github.com/avd-ops/avd-ops/blob/main/docs/portal-engine-spec.md
    applies_to: Node.js 22
    status: verified
    added: "2026-10-21"
  - id: pre-is-a-command-block
    symptom: "not ok - every command block stands alone in Cloud Shell (build/lessons/0015): <code>avd-assess@a5a7eee:methods/assessment.md</code>"
    cause: "tests/site.test.mjs treats every <pre> on an avd-ops.dev page as a Cloud Shell command block, so it must clone, Set-Location and pull. A citation or other copyable text in a <pre> fails it."
    fix: "Use <pre> only for commands. Copyable non-command text goes in a paragraph with <code> (the standards library's .cite-line)."
    source: https://github.com/avd-ops/avd-ops/blob/main/tests/site.test.mjs
    applies_to: avd-ops site tests
    status: verified
    added: "2026-10-22"
  - id: nodejs-url-pathname-windows-drive-slash
    symptom: "ENOENT: no such file or directory, open 'C:\\C:\\...\\file' (or fatal: cannot change to '/C:/...')"
    cause: "`new URL('../', import.meta.url).pathname` returns a leading slash before the drive letter on Windows (`/C:/...`), which `path.join` duplicates into `C:\\C:\\...` and `git -C` rejects, while `path.relative` returns `\\` separators."
    fix: "Convert `import.meta.url` with `fileURLToPath(new URL('../', import.meta.url))` from `node:url`, normalize `relative()` paths to `/` for URLs and manifest keys, and keep `* text=auto eol=lf` in `.gitattributes`."
    source: decisions/0006-run-anywhere.md
    applies_to: Node.js 20+ on Windows
    status: verified
    added: "2026-10-27"
  - id: python-unittest-path-root-on-windows
    symptom: "ValueError: 'C:\\\\Users\\\\...\\\\sources.toml' is not in the subpath of '\\\\' in scripts/kb/test_kb.py"
    cause: "Mocking `validate.ROOT` as `Path('/')` in unit tests resolves to `'\\\\'` on Windows without a drive letter, while `tempfile.mkdtemp()` creates a directory on `C:\\\\`, so `path.relative_to(ROOT)` raises `ValueError`."
    fix: "Patch `validate.ROOT` to the temporary directory (`mock.patch.object(validate, 'ROOT', tmp)`) instead of `Path('/')`."
    source: decisions/0006-run-anywhere.md
    applies_to: Python 3.11+ on Windows
    status: verified
    added: "2026-10-27"
  - id: portal-is-button-specificity-on-wz-tool
    symptom: "A `<button class=\"wz-tool\">` in the wizard rail renders with the primary solid `--accent` fill and border instead of a quiet ghost tool button."
    cause: "In `avd-ops-portal.css` (design system 2.7.0), `.portal :is(button, a.btnlink)` has specificity `(0, 2, 1)` (taken from `a.btnlink`), and `.portal :is(button:hover:not(:disabled), a.btnlink:hover)` has `(0, 3, 1)`, which beats `.portal .wz-tool` `(0, 2, 0)` and `.portal .wz-tool:hover` `(0, 3, 0)` whenever `.wz-tool` is a `<button>`."
    fix: "Qualify quiet wizard and header buttons with the element and container selector (`.portal .wz-rail button.wz-tool:hover:not(:disabled)`, `.portal.shell header.bar button.iconbtn:hover:not(:disabled)`), and set explicit `width` and `height` attributes on inline `<svg>` icons inside header and rail buttons."
    source: decisions/0005-one-app-shell-for-every-page.md
    applies_to: avd-ops design system 2.7.0
    status: verified
    added: "2026-10-27"
  - id: portal-root-url-relative-assets-404
    symptom: "Opening a local portal server at `/` renders the `avd-ops` brand bar and base colors, but leaves the portal's own stylesheet and scripts unloaded (`404 Not Found`)."
    cause: "Serving `site/portal/index.html` directly at `GET /` without a redirect resolves `../assets/avd-ops.css` to `/assets/avd-ops.css` (`200 OK`), while sibling relative URLs (`portal.css`, `portal.js`) resolve to `/portal.css` at `site/` instead of `site/portal/`."
    fix: "Redirect `GET /` and `GET /portal` with `302 Found` (`Location: /portal/`) in local dev servers rooted at `site/` so sibling relative URLs always resolve inside `/portal/`."
    source: decisions/0005-one-app-shell-for-every-page.md
    applies_to: avd-ops portals
    status: verified
    added: "2026-10-27"

