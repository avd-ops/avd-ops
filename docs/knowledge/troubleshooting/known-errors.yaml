# Known errors catalog: the source of truth for troubleshooting/README.md.
# Regenerate the page with `python3 scripts/kb/build.py`. Schema: ../schema/known-errors.schema.json
# `source` is a KB path (relative to docs/knowledge/) or an https URL.

errors:
  - id: bash-3-bad-substitution
    symptom: "deploy.sh: line N: ${JUMPBOX_OS,,}: bad substitution (or mapfile: command not found)"
    cause: macOS ships Bash 3.2; avd-landing-zone's deploy.sh uses Bash 4 features (lowercase expansion, mapfile).
    fix: Run it from Azure Cloud Shell, or install a newer bash (Homebrew) and run it with that bash instead of /bin/bash.
    source: decisions/0006-run-anywhere.md
    applies_to: avd-landing-zone e66d866
    status: unverified
    added: "2026-10-21"
  - id: sh-crlf-on-windows
    symptom: "$'\\r': command not found"
    cause: A Windows checkout with core.autocrlf turned a .sh file's line endings into CRLF.
    fix: Add `*.sh text eol=lf` to .gitattributes, or re-clone with `git config core.autocrlf input`.
    source: decisions/0006-run-anywhere.md
    status: unverified
    added: "2026-10-21"
  - id: git-bash-resource-id-rewritten
    symptom: "az ... --ids fails with a resource ID that starts with C:/Program Files/Git/subscriptions/..."
    cause: Git Bash (MSYS) converts arguments that start with / into Windows paths.
    fix: Set MSYS_NO_PATHCONV=1 before running the script, or run it from Cloud Shell.
    source: decisions/0006-run-anywhere.md
    status: unverified
    added: "2026-10-21"

  - id: pinned-json-hash-crlf-on-windows
    symptom: "assess/method.json does not match its hash in assess/PINS.json. Re-copy it from avd-assess at the pinned commit."
    cause: A Windows checkout with Git's default core.autocrlf (or `* text=auto`) wrote a vendored JSON file with CRLF, so its SHA-256 no longer matched the pin. Seen on a Windows CI runner.
    fix: Mark every hashed vendored file `-text` in .gitattributes (avd-current-state `assess/*.json`, `contracts/*.json`; avd-landing-zone `contracts/...`), then re-clone or `git rm --cached -r . && git reset --hard`.
    source: https://github.com/avd-ops/avd-current-state/pull/36
    applies_to: avd-current-state 6359ece
    status: verified
    added: "2026-10-21"
  - id: bsd-date-no-d
    symptom: "Not a time: '2030-01-01T00:00Z' (deploy.sh --jumpbox-keep-running on macOS)"
    cause: macOS ships BSD date, which has no -d; GNU `date -d` works on Linux, Cloud Shell and Git Bash only. Homebrew bash does not change this. Seen on a macOS CI runner.
    fix: Fall back to `date -j -u -f '%Y-%m-%dT%H:%MZ' "$value" +%s` when `date -d` fails (avd-landing-zone #105).
    source: https://github.com/avd-ops/avd-landing-zone/pull/105
    applies_to: avd-landing-zone 68ffda5
    status: verified
    added: "2026-10-21"
  - id: pwsh-child-loads-real-az-over-fakes
    symptom: "A test that runs a script in a child pwsh with PSModulePath set to fake modules signs in for real (InteractiveBrowserCredential ... must be executed on the main thread on macOS)"
    cause: pwsh puts the user and shared module folders back in front of PSModulePath at startup, so an Az install there (macOS runners keep one) wins over the fakes.
    fix: Set $env:PSModulePath inside the child (`pwsh -Command "`$env:PSModulePath = '<fakes>'; & '<script>' ..."`) instead of only in the parent.
    source: https://github.com/avd-ops/avd-current-state/pull/36
    applies_to: PowerShell 7.4
    status: verified
    added: "2026-10-21"
