name: walkthrough-coverage

# Weekly check comparing repos.json public repos against docs/knowledge/getting-started/*.md.
# Reports uncovered repos in the job summary and opens/updates a tracking issue when needed.

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: walkthrough-coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check getting-started walkthrough coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/kb/walkthrough_check.py | tee -a "$GITHUB_STEP_SUMMARY"
          UNCOVERED=$(python3 -c "import json, subprocess; d=json.loads(subprocess.check_output(['python3','scripts/kb/walkthrough_check.py','--json'])); print('\n'.join(f\"- \`{x['name']}\` ({x['layer']}, {x['maturity']})\" for x in d['uncovered']))")
          if [ -n "$UNCOVERED" ]; then
            BODY="Repos in \`repos.json\` without a getting-started walkthrough reference in \`docs/knowledge/getting-started/\`:

          $UNCOVERED

          Generated by \`scripts/kb/walkthrough_check.py\`."
            EXISTING=$(gh issue list --repo "${{ github.repository }}" --label "pick-up" --search "Walkthrough coverage gaps in:title" --state open --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
            else
              gh issue create --repo "${{ github.repository }}" --title "Walkthrough coverage gaps" --label "pick-up" --body "$BODY" || true
            fi
          fi
