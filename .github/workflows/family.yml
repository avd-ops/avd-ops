name: family

# The family check (scripts/family-check.mjs, decision 0002): every public AVD repo in repos.json
# carries the avd-ops line under its README title and names no banned project. It reads the other
# repos' default branches with anonymous clones, so it runs weekly and by hand rather than on pull
# requests, where another repo's state would turn this repo's CI red. Nothing here touches Azure.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/family-check.mjs
