name: blog-digest

# Weekly digest of releases, merged pull requests, accepted findings and decision records across
# the public repos in repos.json. Runs Fridays at 07:00 CST (13:00 UTC), writes
# docs/blog/YYYY-MM-DD-weekly-digest.md, rebuilds site/blog/, runs the site test suite, and opens
# a pull request for review before publishing.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in Settings > Actions > General.

on:
  schedule:
    - cron: '0 13 * * 5'
  workflow_dispatch:
    inputs:
      since:
        description: 'Start UTC date (YYYY-MM-DD, defaults to 7 days ago)'
        required: false
      until:
        description: 'End UTC date (YYYY-MM-DD, defaults to yesterday)'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-digest
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Draft weekly digest
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: |
          if [ -n "$INPUT_SINCE" ]; then
            SINCE_DATE="$INPUT_SINCE"
          else
            SINCE_DATE=$(date -u -d '7 days ago' +%F)
          fi
          if [ -n "$INPUT_UNTIL" ]; then
            UNTIL_DATE="$INPUT_UNTIL"
          else
            UNTIL_DATE=$(date -u -d 'yesterday' +%F)
          fi
          echo "until=$UNTIL_DATE" >> "$GITHUB_OUTPUT"
          node scripts/site/draft-blog.mjs --since "$SINCE_DATE" --until "$UNTIL_DATE"
          if [ -f "docs/blog/${UNTIL_DATE}-weekly-digest.md" ] && [ -n "$(git status --porcelain docs/blog/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build blog and run tests
        if: steps.draft.outputs.changed == 'true'
        run: |
          node scripts/site/build-blog.mjs
          node --test "tests/*.test.mjs"
      - name: Open pull request
        if: steps.draft.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNTIL_DATE: ${{ steps.draft.outputs.until }}
        run: |
          BRANCH="blog/weekly-${UNTIL_DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/blog/ site/blog/
          git commit -m "blog: weekly digest ${UNTIL_DATE}"
          git push -f origin "$BRANCH"
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --title "blog: weekly digest ${UNTIL_DATE}" \
              --body "Automated weekly digest ending \`${UNTIL_DATE}\` across the public \`avd-ops\` repositories.\n\nNo KB entry: automated weekly blog digest generated from public repo activity." \
              --label "no-kb" || \
            gh pr create \
              --title "blog: weekly digest ${UNTIL_DATE}" \
              --body "Automated weekly digest ending \`${UNTIL_DATE}\` across the public \`avd-ops\` repositories.\n\nNo KB entry: automated weekly blog digest generated from public repo activity."
          fi
