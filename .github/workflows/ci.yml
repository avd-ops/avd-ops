name: ci

# Site tests: the notice on every page, links resolve, the avd-ops name, standalone Cloud Shell blocks,
# the docs built from docs/knowledge/ up to date, and no banned names (repos.json).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: node --test
        run: node --test "tests/*.test.mjs"

  # The portal engine runs anywhere (decision 0006): its tests and manifest on Windows and macOS too.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: engine tests
        run: node --test tests/engine.test.mjs
      - name: engine manifest
        run: node scripts/site/engine-manifest.mjs --check
