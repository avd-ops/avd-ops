name: Reusable release

# Standard enterprise release workflow for avd-ops repositories (ADR 0029).
# Callers run their own test/build job first, optionally upload a release artifact,
# and call this workflow on `push: tags: ['v*']` (or component tag prefixes).
#
# Example caller (.github/workflows/release.yml):
#   on:
#     push:
#       tags: ['v*']
#   permissions: {}
#   jobs:
#     release:
#       uses: avd-ops/avd-ops/.github/workflows/reusable-release.yml@main
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write

on:
  workflow_call:
    inputs:
      default-branch:
        description: 'Default branch name that tagged commits must descend from (main or master)'
        type: string
        required: false
        default: 'main'
      tag-prefix:
        description: 'Required tag prefix before SemVer (e.g. v, ds-v, pe-v)'
        type: string
        required: false
        default: 'v'
      changelog-path:
        description: 'Path to Keep a Changelog file'
        type: string
        required: false
        default: 'CHANGELOG.md'
      artifact-name:
        description: 'Optional workflow artifact name from caller build job to attach and attest'
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ inputs.default-branch }}
      TAG_PREFIX: ${{ inputs.tag-prefix }}
      CHANGELOG_PATH: ${{ inputs.changelog-path }}
      ARTIFACT_NAME: ${{ inputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify SemVer tag and default-branch ancestry
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          tag = os.environ["TAG"]
          prefix = re.escape(os.environ["TAG_PREFIX"])
          branch = os.environ["DEFAULT_BRANCH"]
          sha = os.environ["GITHUB_SHA"]
          pat = rf"^{prefix}(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$"
          if not re.match(pat, tag):
              sys.exit(f"RESULT FAIL {tag} does not match {pat}")
          subprocess.run(["git", "fetch", "--no-tags", "origin", branch], check=True)
          rc = subprocess.run(["git", "merge-base", "--is-ancestor", sha, f"origin/{branch}"]).returncode
          if rc != 0:
              sys.exit(f"RESULT FAIL {tag} ({sha}) is not an ancestor of origin/{branch}")
          print(f"RESULT PASS {tag} is a valid SemVer tag on origin/{branch}")
          PY

      - name: Download caller artifacts (when provided)
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: release-assets

      - name: Generate SHA-256 checksums for artifacts
        if: inputs.artifact-name != ''
        run: |
          cd release-assets
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Attest build provenance for artifacts
        if: inputs.artifact-name != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*'

      - name: Build and leak-scan release notes
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path

          tag = os.environ["TAG"]
          prefix = os.environ["TAG_PREFIX"]
          version = tag[len(prefix):] if tag.startswith(prefix) else tag
          repo = os.environ["GH_REPO"]
          sha = os.environ["GITHUB_SHA"]
          cl_path = Path(os.environ["CHANGELOG_PATH"])

          section = ""
          if cl_path.exists():
              text = cl_path.read_text(encoding="utf-8")
              pat = re.compile(rf"^##\s+\[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^##\s|\Z)", re.M | re.S)
              m = pat.search(text)
              if m:
                  section = m.group(1).strip()

          if not section:
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases/generate-notes", "-f", f"tag_name={tag}"],
                  text=True,
              )
              section = json.loads(raw).get("body", "").strip()

          notes = (
              f"{repo} `{tag}`, built from `{sha}`.\n\n"
              "Personal project, not for production, as is; not affiliated with the author's employer or Microsoft.\n\n"
              f"{section}\n"
          )

          # Leak and policy scan before publishing
          bad_patterns = [
              (r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", "UUID/GUID"),
              (r"\b(?:10|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}\b", "private IPv4"),
              (r"[A-Za-z0-9._%+-]+@(?!users\.noreply\.github\.com|example\.com|contoso\.com)[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "email"),
              (r"\b(?:ghp_|gho_|github_pat_|AKIA)[A-Za-z0-9_]{10,}\b", "token"),
          ]
          for pat, label in bad_patterns:
              if re.search(pat, notes, re.I):
                  sys.exit(f"RESULT FAIL release notes matched {label} leak pattern")

          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print("RESULT PASS release notes built and scanned")
          PY

      - name: Create draft release and publish (immutable)
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if [ -d release-assets ] && [ -n "$(ls -A release-assets)" ]; then
            gh release create "$TAG" release-assets/* --draft --verify-tag $PRERELEASE_FLAG --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --verify-tag $PRERELEASE_FLAG --title "$TAG" --notes-file release-notes.md
          fi
          gh release edit "$TAG" --draft=false
          echo "RESULT PASS published $TAG"
