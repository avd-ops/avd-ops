name: pages

# Publishes site/ (the avd-ops site) to GitHub Pages at https://avd-ops.dev/. Needs Settings > Pages >
# Source set to "GitHub Actions" and the custom domain set there too (Actions deployments need no
# CNAME file). Nothing here touches Azure.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'llms.txt'
      - 'scripts/site/build-llms.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Include canonical llms.txt
        run: node scripts/site/build-llms.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
