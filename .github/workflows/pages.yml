name: pages

# Publishes site/ (the avd-ops site) to GitHub Pages at https://avd-ops.dev/. Needs Settings > Pages >
# Source set to "GitHub Actions" and the custom domain set there too (Actions deployments need no
# CNAME file). Nothing here touches Azure.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'llms.txt'
      - 'scripts/site/build-llms.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Include canonical llms.txt
        run: node scripts/site/build-llms.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
