name: kb-prior-art

# Run a prior-art check from the Actions tab: searches the KB, sibling KBs, GitHub repos, code
# and issues for a topic and writes the report to the job summary.

on:
  workflow_dispatch:
    inputs:
      query:
        description: What are you about to build? (e.g. "prompt caching")
        required: true

permissions:
  contents: read

jobs:
  # Decision 0008: skip when a family directive pauses this workflow, or KB_PAUSED is set here.
  gate:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.gate.outputs.paused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/kb/requirements.txt
      - id: gate
        env:
          KB_PAUSED: ${{ vars.KB_PAUSED }}
        run: python3 scripts/kb/directives.py gate kb-prior-art

  search:
    needs: gate
    if: needs.gate.outputs.paused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/kb/requirements.txt
      - name: Search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUERY: ${{ inputs.query }}
        run: python3 scripts/kb/prior_art.py "$QUERY"
