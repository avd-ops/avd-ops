<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-label="Bicep subscription deployment dependency graph.">
<style>
  svg{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;background-color:#fbfcfc;background-image:linear-gradient(#e3eaea 1px,transparent 1px),linear-gradient(90deg,#e3eaea 1px,transparent 1px);background-size:24px 24px;color:#4e5e62}
  .d-box{fill:#ffffff;stroke:#b8c3c5;stroke-width:1.2}
  .d-top{fill:#e1f2ef;stroke:#0b7a6e;stroke-width:1.2}
  .d-ext{fill:#f5f7f7;stroke:#b8c3c5;stroke-width:1.2;stroke-dasharray:5 4}
  .d-tier{fill:#f7ecdc;stroke:#9a5b12;stroke-width:1.2;stroke-dasharray:5 4}
  .d-good{fill:#e1f3e9;stroke:#18794e;stroke-width:1.2}
  .d-caution{fill:#fbf0d9;stroke:#8a5a00;stroke-width:1.2}
  .d-info{fill:#e4edfb;stroke:#2456a6;stroke-width:1.2}
  .d-zone{fill:#edf1f1;stroke:#dae1e2;stroke-width:1.2}
  .d-ground{fill:#edf1f1;stroke:#b8c3c5;stroke-width:1.2}
  .d-pair{fill:none;stroke:#0b7a6e;stroke-width:1.2;stroke-dasharray:2 4}
  .d-edge{fill:none;stroke:#4e5e62;stroke-width:1.4}
  .d-opt{fill:none;stroke:#4e5e62;stroke-width:1.4;stroke-dasharray:5 4}
  .d-head{fill:#4e5e62}
  .d-name{fill:#0f1c1e;font:700 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
  .d-sub{fill:#4e5e62;font:12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
  .d-lbl{fill:#0f1c1e;font:600 11.5px "IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
  .d-band{fill:#0b7a6e;font:600 11px "IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em}
  .d-gname{fill:#0f1c1e;font:700 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
  .d-gsub{fill:#4e5e62;font:12px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
  .d-mask{fill:#ffffff}
</style>
<defs><marker id="ah-dag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="d-band" x="105" y="34" text-anchor="middle">STAGE 1: TELEMETRY</text>
<rect class="d-caution" x="25" y="66" width="160" height="72" rx="8"/>
<text class="d-name" x="105" y="96" text-anchor="middle">monitoring</text>
<text class="d-sub" x="105" y="116" text-anchor="middle">LAW · DCR · alerts</text>

<rect class="d-box" x="25" y="196" width="160" height="72" rx="8"/>
<text class="d-name" x="105" y="226" text-anchor="middle">governance</text>
<text class="d-sub" x="105" y="246" text-anchor="middle">Policy · Defender · budget</text>

<text class="d-band" x="315" y="34" text-anchor="middle">STAGE 2: VNET</text>
<rect class="d-top" x="235" y="66" width="160" height="72" rx="8"/>
<text class="d-name" x="315" y="96" text-anchor="middle">network</text>
<text class="d-sub" x="315" y="116" text-anchor="middle">VNet · NSGs · NAT GW</text>

<text class="d-band" x="525" y="34" text-anchor="middle">STAGE 3: DNS</text>
<rect class="d-good" x="445" y="66" width="160" height="72" rx="8"/>
<text class="d-name" x="525" y="96" text-anchor="middle">privateDns</text>
<text class="d-sub" x="525" y="116" text-anchor="middle">file · vaultcore · wvd</text>

<text class="d-band" x="745" y="34" text-anchor="middle">STAGE 4: PARALLEL SERVICES</text>
