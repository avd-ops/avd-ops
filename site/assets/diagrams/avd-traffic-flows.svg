  .d-band{fill:#0b7a6e;font:600 11px "IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em}
  .d-gname{fill:#0f1c1e;font:700 14px "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
