<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-label="End-to-end session, Reverse Connect, RDP Shortpath, Entra Kerberos SMB and telemetry traffic flows.">
<style>
  svg{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#475569}
