# Personal project, not for production, provided as is; not affiliated with the author's employer or Microsoft.
# TEMPLATE: Copy into .github/workflows/ of your single private companion repo (avd-private) when you need
# private static web pages without GitHub Pro+ (ADR 0026). Uses Azure Static Web Apps Free ($0/month) and OIDC.
name: Deploy private pages (Azure Static Web Apps Free)

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages-swa.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pages-swa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token and deploy site/
        env:
          SWA_NAME: ${{ vars.SWA_NAME }}
          RESOURCE_GROUP: ${{ vars.SWA_RESOURCE_GROUP }}
        run: |
          token=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          npx --yes @azure/static-web-apps-cli@latest deploy ./site --deployment-token "$token" --env production
